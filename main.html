<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signify</title>
 
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Hind:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="main.css">
</head>
<body>

  <main>
    <!-- GREETING -->
    <section class="greeting">
      <h1>Namaste! 👋</h1>
      <p>Ready to learn a few signs today?</p>
    </section>

    <!-- BIG ISL BUTTON (goes to the setup page, which we'll make next) -->
    <a href="setup.html" class="big-button">
      <div>
        <div class="big-title">Learn ISL</div>
        <div class="big-hindi">ISL सीखें</div>
        <div class="big-sub">Lesson 1 · 5 minutes</div>
      </div>
      <div class="arrow">➜</div>
    </a>

   
    <section class="tiles">
      <a href="progress.html" class="tile">
        <span class="tile-emoji">🏆</span>
        <span class="tile-title">My progress</span>
        <span class="tile-sub">Level & lessons left</span>
      </a>
      <a href="translate.html" class="tile">
        <span class="tile-emoji">🌏</span>
        <span class="tile-title">Translator</span>
        <span class="tile-sub">10 Indian languages</span>
      </a>
    </section>



     <section class="helper">
      <h2>💬 Ask Signify</h2>
      <p class="helper-sub">Ask anything about sign language or deaf culture.</p>

      <div id="messages" class="messages">
        <div class="msg bot">Hi! I'm your Signify helper. Ask me a question 😊</div>
      </div>

      <form id="chat-form" class="chat-form">
        <input id="chat-input" type="text" placeholder="Type your question..." autocomplete="off">
        <button type="submit">Send</button>
      
      </form>
    </section>

    <script>
    
    const WORKER_URL = "https://signify-proxy.anwitaghosh20.workers.dev";

    
    const form = document.getElementById("chat-form");
    const input = document.getElementById("chat-input");
    const messages = document.getElementById("messages");
    const sendButton = form.querySelector("button");

   
    const history = [];

    // Adds a chat bubble and returns it
    function addMessage(text, who) {
      const bubble = document.createElement("div");
      bubble.className = "msg " + who;
      bubble.textContent = text;
      messages.appendChild(bubble);
      messages.scrollTop = messages.scrollHeight;
      return bubble;
    }

    
    form.addEventListener("submit", async function (event) {
      event.preventDefault();               
      const question = input.value.trim();
      if (question === "") return;

      addMessage(question, "me");
      history.push({ role: "user", content: question });
      input.value = "";

      
      const thinking = addMessage("Thinking... 🤔", "bot");
      sendButton.disabled = true;

      try {
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history }),
        });
        const data = await response.json();

        if (data.reply) {
          thinking.textContent = data.reply;          // swap "Thinking..." for the answer
          history.push({ role: "assistant", content: data.reply });
        } else {
          thinking.textContent = "⚠️ " + (data.error || "Something went wrong. Try again.");
        }
      } catch (error) {
        thinking.textContent = "⚠️ Couldn't connect. Check your internet and try again.";
      }

      sendButton.disabled = false;
      messages.scrollTop = messages.scrollHeight;
    });
  </script>

     


  </main>
</body>
</html>
