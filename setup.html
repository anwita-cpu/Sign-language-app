<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signify · Setup</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Hind:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="main.css">
  <script src="i18n.js"></script>

  <style>
    /* ===== SETUP PAGE: all its styles live here ===== */
    body.setup-page {
      margin: 0;
      min-height: 100vh;
      color: #28264A;
      font-family: "Hind", sans-serif;
      background:
        radial-gradient(circle at 10% 8%, #FFE3EC 0, transparent 32%),
        radial-gradient(circle at 92% 18%, #DDF5EE 0, transparent 30%),
        radial-gradient(circle at 80% 95%, #FFF1CC 0, transparent 35%),
        #F3F0FF;
    }
    .setup-wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 48px; }

    .setup-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

    /* Hero */
    .setup-hero { text-align: center; margin: 18px 0 22px; }
    .setup-wave {
      width: 84px; height: 84px; margin: 0 auto 10px; border-radius: 50%;
      display: grid; place-items: center; font-size: 2.6rem;
      background: #fff; box-shadow: 0 6px 0 #DCD5FF, 0 18px 30px -12px rgba(139,124,246,.5);
      animation: bob 2.4s ease-in-out infinite;
    }
    .setup-wave span { display: inline-block; animation: wave 2.4s ease-in-out infinite; transform-origin: 70% 80%; }
    @keyframes bob  { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
    @keyframes wave { 0%,60%,100% { transform: rotate(0) } 10%,30% { transform: rotate(16deg) } 20%,40% { transform: rotate(-8deg) } }
    .setup-hero h1 { font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: clamp(1.8rem, 6vw, 2.4rem); line-height: 1.15; margin: 0; }
    .setup-hero p { margin: 4px 0 0; color: #6A6989; font-size: 1.05rem; }

    /* Progress: 3 little segments that fill as you answer */
    .setup-steps { display: flex; gap: 6px; justify-content: center; margin-top: 14px; }
    .setup-steps i { width: 44px; height: 8px; border-radius: 99px; background: #DCD5FF; transition: background .3s, transform .3s; }
    .setup-steps i.on { background: #8B7CF6; transform: scaleY(1.2); }

    /* Question cards */
    .q-card {
      border: 0; margin: 0 0 16px; padding: 20px;
      background: #fff; border-radius: 28px;
      box-shadow: 0 5px 0 #E4DEFF, 0 20px 40px -24px rgba(40,38,74,.35);
    }
    .q-card legend { display: contents; }
    .q-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .q-num {
      flex-shrink: 0; width: 38px; height: 38px; border-radius: 12px;
      display: grid; place-items: center; color: #fff;
      font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: 1.2rem;
    }
    .q1 .q-num { background: #8B7CF6; box-shadow: 0 3px 0 #6A5AD9; }
    .q2 .q-num { background: #FF7A93; box-shadow: 0 3px 0 #E0566F; }
    .q3 .q-num { background: #2EC4A0; box-shadow: 0 3px 0 #1E9E80; }
    .q-title { font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: 1.25rem; line-height: 1.2; }
    .q-optional { font-family: "Hind", sans-serif; font-weight: 400; font-size: .95rem; color: #6A6989; }

    /* Tap tiles (the radio buttons) */
    .tiles { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
    .tiles.goals { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .tile {
      position: relative; cursor: pointer; user-select: none;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      min-height: 96px; padding: 12px 8px; text-align: center;
      border: 2px solid #E4E8F4; border-radius: 20px; background: #FAFBFF;
      box-shadow: 0 4px 0 #E4E8F4;
      font-weight: 600; font-size: 1rem; line-height: 1.25;
      transition: transform .12s, border-color .2s, background .2s, box-shadow .2s;
    }
    .tile:hover { transform: translateY(-2px); border-color: #C9BFFF; }
    .tile:active { transform: translateY(2px); box-shadow: 0 1px 0 #E4E8F4; }
    .tile input { position: absolute; opacity: 0; pointer-events: none; }
    .tile .emoji { font-size: 2rem; line-height: 1; transition: transform .25s; }
    .tile:has(input:checked) {
      background: #F1EEFF; border-color: #8B7CF6; box-shadow: 0 4px 0 #8B7CF6;
    }
    .tile:has(input:checked) .emoji { transform: scale(1.2) rotate(-6deg); }
    .tile:has(input:checked)::after {
      content: "✓"; position: absolute; top: 8px; right: 10px;
      width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
      background: #8B7CF6; color: #fff; font-size: .8rem; font-weight: 800;
    }
    .tile:has(input:focus-visible) { outline: 3px solid #FFC24B; outline-offset: 3px; }
    .goals .tile:nth-child(1) .emoji { font-size: 1.6rem; }
    .goals .tile:nth-child(3) .emoji { font-size: 2.4rem; }

    /* Name box */
    .name-input {
      width: 100%; box-sizing: border-box; min-height: 56px; padding: 0 18px;
      border: 2px solid #E4E8F4; border-radius: 18px; background: #FAFBFF;
      font: inherit; font-size: 1.1rem; color: #28264A;
      transition: border-color .2s, box-shadow .2s;
    }
    .name-input:focus { outline: none; border-color: #FF7A93; box-shadow: 0 0 0 4px #FFE3EC; background: #fff; }

    /* Start button */
    .start-btn {
      width: 100%; min-height: 62px; margin-top: 6px; border: 0; border-radius: 22px; cursor: pointer;
      background: #8B7CF6; color: #fff; box-shadow: 0 6px 0 #6A5AD9;
      font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: 1.3rem;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: transform .1s, box-shadow .1s, opacity .2s;
      opacity: .55;
    }
    .start-btn.ready { opacity: 1; animation: pop .5s ease; }
    .start-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #6A5AD9; }
    .start-btn:focus-visible { outline: 3px solid #FFC24B; outline-offset: 3px; }
    @keyframes pop { 50% { transform: scale(1.04) } }

    @media (max-width: 420px) {
      .q-card { padding: 16px; border-radius: 24px; }
      .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .tiles .tile:last-child:nth-child(odd) { grid-column: 1 / -1; }
      .tiles.goals { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .tiles.goals .tile:last-child { grid-column: auto; }
      .goals .tile { min-height: 88px; font-size: .9rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      .setup-wave, .setup-wave span, .start-btn.ready { animation: none; }
    }
  </style>
</head>
<body class="setup-page">
  <main class="setup-wrap">

    <div class="setup-top">
      <a href="main.html" class="back">← <span data-i18n="home">Home</span></a>

      <div class="setup-steps" aria-hidden="true"><i></i><i></i><i></i></div>

    <form id="setup-form">

      <!-- QUESTION 1 -->
      <fieldset class="q-card q1">
        <legend><span class="q-head"><span class="q-num">1</span><span class="q-title" data-i18n="s_q1">Who are you learning for?</span></span></legend>
        <div class="tiles">
          <label class="tile"><input type="radio" name="who" value="child" required><span class="emoji">👨‍👩‍👧</span><span data-i18n="s_child">My child</span></label>
          <label class="tile"><input type="radio" name="who" value="sibling"><span class="emoji">👧</span><span data-i18n="s_sibling">My brother or sister</span></label>
          <label class="tile"><input type="radio" name="who" value="student"><span class="emoji">🧑‍🏫</span><span data-i18n="s_student">My student</span></label>
          <label class="tile"><input type="radio" name="who" value="friend"><span class="emoji">🤝</span><span data-i18n="s_friend">A friend</span></label>
          <label class="tile"><input type="radio" name="who" value="fun"><span class="emoji">✨</span><span data-i18n="s_fun">Just for fun</span></label>
        </div>
      </fieldset>

      <!-- QUESTION 2 -->
      <fieldset class="q-card q2">
        <legend><span class="q-head"><span class="q-num">2</span><span class="q-title"><span data-i18n="s_q2">Who will you sign with?</span> <span class="q-optional" data-i18n="s_optional">(optional)</span></span></span></legend>
        <input type="text" id="their-name" class="name-input" data-i18n-ph="s_name_ph" placeholder="e.g. Riya" autocomplete="off">
      </fieldset>

      <!-- QUESTION 3 -->
      <fieldset class="q-card q3">
        <legend><span class="q-head"><span class="q-num">3</span><span class="q-title" data-i18n="s_q3">Daily goal</span></span></legend>
        <div class="tiles goals">
          <label class="tile"><input type="radio" name="goal" value="5" required><span class="emoji">🌱</span><span class="goal-text" data-min="5">5 minutes a day</span></label>
          <label class="tile"><input type="radio" name="goal" value="10"><span class="emoji">🌿</span><span class="goal-text" data-min="10">10 minutes a day</span></label>
          <label class="tile"><input type="radio" name="goal" value="15"><span class="emoji">🌳</span><span class="goal-text" data-min="15">15 minutes a day</span></label>
        </div>
      </fieldset>

      <button type="submit" class="start-btn"><span data-i18n="s_start">Start Lesson 1</span> <span aria-hidden="true">➜</span></button>
    </form>

  </main>

    Object.keys(SETUP_WORDS).forEach((code) => {
      if (I18N[code]) Object.assign(I18N[code], SETUP_WORDS[code]);
    });
    applyI18n();
    document.querySelectorAll(".goal-text").forEach((el) => {
      el.textContent = t("s_goal", { n: el.dataset.min });
    });

    // ---------- Fill in last time's answers, if any ----------
    const setupForm = document.getElementById("setup-form");
    const nameBox = document.getElementById("their-name");
    try {
      const saved = JSON.parse(localStorage.getItem("signify-profile") || "{}");
      if (saved.who)  { const r = setupForm.querySelector('input[name="who"][value="' + saved.who + '"]');  if (r) r.checked = true; }
      if (saved.goal) { const r = setupForm.querySelector('input[name="goal"][value="' + saved.goal + '"]'); if (r) r.checked = true; }
      if (saved.name) nameBox.value = saved.name;
    } catch (e) {}

    // ---------- Progress bar + "ready" button ----------
    const bars = document.querySelectorAll(".setup-steps i");
    const startBtn = setupForm.querySelector(".start-btn");
    function updateSteps() {
      const done = [
        !!setupForm.querySelector('input[name="who"]:checked'),
        nameBox.value.trim() !== "",
        !!setupForm.querySelector('input[name="goal"]:checked'),
      ];
      bars.forEach((b, i) => b.classList.toggle("on", done[i]));
      const ready = done[0] && done[2];
      if (ready && !startBtn.classList.contains("ready")) startBtn.classList.add("ready");
      if (!ready) startBtn.classList.remove("ready");
    }
    setupForm.addEventListener("change", updateSteps);
    nameBox.addEventListener("input", updateSteps);
    updateSteps();

    // ---------- Save and go to the first lesson ----------
    setupForm.addEventListener("submit", function (event) {
      event.preventDefault();
      const profile = {
        who:  setupForm.querySelector('input[name="who"]:checked').value,
        name: nameBox.value.trim(),
        goal: setupForm.querySelector('input[name="goal"]:checked').value,
      };
      try { localStorage.setItem("signify-profile", JSON.stringify(profile)); } catch (e) {}
      window.location.href = "lesson.html?stop=1";
    });
  </script>
