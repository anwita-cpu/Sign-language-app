<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signify · My progress</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Hind:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="main.css">
  <link rel="stylesheet" href="home.css">
  <script src="i18n.js"></script>
  <style>
    /* ===== MY PROGRESS PAGE: all its styles live here ===== */
    .pg main { max-width: 1040px; }
    .pg-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .pg-back {
      display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px 0 10px;
      border-radius: 14px; border: 2px solid var(--line); background: var(--card); color: var(--muted); text-decoration: none; font-weight: 600;
    }
    .pg-back:focus-visible, .pg a:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }
    .pg-card { padding: 22px; display: flex; flex-direction: column; gap: 14px; }
    .pg-card h2 { margin: 0; font-size: 1.4rem; line-height: 1.15; }
    .pg-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

    /* Hero */
    .pg-hero { display: flex; flex-wrap: wrap; gap: 22px; align-items: center; padding: 24px 26px; }
    .pg-hero-main { flex: 1 1 300px; min-width: 0; display: flex; align-items: center; gap: 18px; }
    .pg-medal {
      width: 84px; height: 84px; flex-shrink: 0; border-radius: 50%; display: grid; place-items: center; font-size: 2.6rem;
      background: #FFF1D6; box-shadow: 0 5px 0 #F2D9A6; animation: medal-bob 3s ease-in-out infinite;
    }
    @keyframes medal-bob { 50% { transform: translateY(-5px) rotate(-4deg); } }
    .pg-hero h1 { margin: 2px 0 6px; font-size: 2.4rem; line-height: 1.05; }
    .pg-goal { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .pg-goal span { padding: 6px 14px; border-radius: 99px; background: #F1EEFE; color: #4B3DC4; font-weight: 600; font-size: 0.95rem; }
    .pg-goal a { color: #4B3DC4; font-weight: 600; font-size: 0.95rem; }
    .pg-stats { flex: 1 1 360px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .pg-stat { border-radius: 20px; padding: 14px 12px; text-align: center; display: flex; flex-direction: column; gap: 2px; }
    .pg-stat b { font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: 2.2rem; line-height: 1; font-variant-numeric: tabular-nums; }
    .pg-stat small { font-size: 0.85rem; font-weight: 600; }
    .pg-stat.fire { background: #FFF1D6; color: #8A4B00; }
    .pg-stat.signs { background: #F1EEFE; color: #4B3DC4; }
    .pg-stat.stops { background: #DCF5EC; color: #146B52; }

    .pg-two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px; align-items: start; }

    /* Calendar */
    .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
    .cal .dow { text-align: center; font-size: 0.75rem; font-weight: 600; color: var(--muted); }
    .cal .day {
      aspect-ratio: 1; border-radius: 10px; background: #ECE9F7; color: var(--muted);
      display: grid; place-items: center; font-size: 0.85rem; font-weight: 600; font-variant-numeric: tabular-nums;
    }
    .cal .day.on { background: var(--green); color: #fff; }
    .cal .day.today { box-shadow: inset 0 0 0 2px var(--green-dark); }
    .cal .day.future { background: transparent; border: 2px dashed #E4E0F4; color: #C3C0D8; }

    /* Stops */
    .pg-stops { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .pg-stops a, .pg-stops .stop-row {
      display: flex; align-items: center; gap: 12px; padding: 8px 12px 8px 8px; border-radius: 16px;
      border: 2px solid var(--line); background: var(--card); color: var(--text); text-decoration: none;
    }
    .pg-stops a:hover { border-color: var(--green); }
    .pg-stops .s-emoji { width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; display: grid; place-items: center; font-size: 1.3rem; background: #F1EEFE; }
    .pg-stops .s-name { flex: 1; min-width: 0; font-weight: 600; }
    .pg-stops .s-state { font-size: 1.1rem; flex-shrink: 0; }
    .pg-stops .done .s-emoji { background: #DCF5EC; }
    .pg-stops .now { border-color: var(--green); background: #F7F5FF; }
    .pg-stops .locked { opacity: 0.55; }
    .pg-stops .locked .s-emoji { filter: grayscale(1); }

    /* Learned signs */
    .pg-signs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .pg-signs a {
      display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-radius: 18px; text-decoration: none; color: var(--text);
      border: 2px solid var(--line); background: var(--card); box-shadow: 0 3px 0 var(--line); transition: transform 0.12s;
    }
    .pg-signs a:hover { transform: translateY(-2px); border-color: var(--green); }
    .pg-signs .w-main { font-weight: 700; font-size: 1.25rem; }
    .pg-signs .w-sub { font-size: 0.9rem; color: var(--muted); }
    .pg-mystery { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 18px; border: 2px dashed var(--line); color: var(--muted); font-weight: 600; }
    .pg-mystery .q { width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; display: grid; place-items: center; background: #ECE9F7; font-size: 1.2rem; }
    .pg-empty { margin: 0; color: var(--muted); }

    /* Badges */
    .pg-badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
    .badge { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 16px 10px; border-radius: 20px; text-align: center; border: 2px solid var(--line); background: var(--card); }
    .badge .b-icon { width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; font-size: 1.9rem; background: #FFF1D6; box-shadow: 0 4px 0 #F2D9A6; }
    .badge .b-name { font-weight: 600; font-size: 0.95rem; line-height: 1.2; }
    .badge.off { background: #F7F7FB; }
    .badge.off .b-icon { background: #ECE9F7; box-shadow: none; filter: grayscale(1); opacity: 0.45; }
    .badge.off .b-name { color: var(--muted); }

    @media (max-width: 760px) {
      .pg-two { grid-template-columns: minmax(0, 1fr); }
      .pg-hero { padding: 18px; }
      .pg-hero h1 { font-size: 1.9rem; }
      .pg-medal { width: 68px; height: 68px; font-size: 2.1rem; }
      .pg-stat b { font-size: 1.8rem; }
      .pg-card { padding: 16px; }
    }
    @media (prefers-reduced-motion: reduce) { .pg-medal { animation: none; } }
  </style>
</head>
<body class="home-page pg">
  <main>

      <div class="pg-head"><h2 id="h-signs">Signs you've learned</h2><span class="home-muted" id="h-signs-sub">Tap one to watch it again</span></div>

      <div id="pg-mysteries" style="display:flex;flex-direction:column;gap:8px"></div>

    <!-- BADGES -->
    <section class="home-card pg-card">
      <div class="pg-head"><h2 id="h-badges">Badges</h2><span class="home-muted" id="h-badges-sub"></span></div>
      <div class="pg-badges" id="pg-badges"></div>
    </section>

  </main>

      ml: ["തുടർച്ചയായ ദിവസങ്ങൾ","പഠിച്ച ആംഗ്യങ്ങൾ","പൂർത്തിയായ സ്റ്റോപ്പുകൾ","ദിവസ ലക്ഷ്യം: {n} മിനിറ്റ്","ഇതുവരെ ദിവസ ലക്ഷ്യമില്ല","മാറ്റുക","നിങ്ങളുടെ പരിശീലന ദിവസങ്ങൾ","കഴിഞ്ഞ 4 ആഴ്ച","നിങ്ങളുടെ സ്റ്റോപ്പുകൾ","നിങ്ങൾ പഠിച്ച ആംഗ്യങ്ങൾ","വീണ്ടും കാണാൻ ടാപ്പ് ചെയ്യൂ","ഇതുവരെ ആംഗ്യങ്ങളൊന്നുമില്ല. ഇത് നിറയ്ക്കാൻ ആദ്യ പാഠം പൂർത്തിയാക്കൂ!","{stop} പാഠത്തിൽ ഇനിയും {n} കണ്ടെത്താനുണ്ട്","ബാഡ്ജുകൾ","ആദ്യ ആംഗ്യം","ഭക്ഷണം പൂർത്തിയായി","കുടുംബം പൂർത്തിയായി","തുടർച്ചയായി 3 ദിവസം","തുടർച്ചയായി 7 ദിവസം","അധ്യായം പൂർത്തിയായി","{b}-ൽ {a} നേടി","പൂട്ടി"],
      pa: ["ਲਗਾਤਾਰ ਦਿਨ","ਸਿੱਖੇ ਸੰਕੇਤ","ਪੂਰੇ ਪੜਾਅ","ਰੋਜ਼ਾਨਾ ਟੀਚਾ: {n} ਮਿੰਟ","ਹਾਲੇ ਕੋਈ ਰੋਜ਼ਾਨਾ ਟੀਚਾ ਨਹੀਂ","ਬਦਲੋ","ਤੁਹਾਡੇ ਅਭਿਆਸ ਦੇ ਦਿਨ","ਪਿਛਲੇ 4 ਹਫ਼ਤੇ","ਤੁਹਾਡੇ ਪੜਾਅ","ਤੁਹਾਡੇ ਸਿੱਖੇ ਸੰਕੇਤ","ਦੁਬਾਰਾ ਦੇਖਣ ਲਈ ਟੈਪ ਕਰੋ","ਹਾਲੇ ਕੋਈ ਸੰਕੇਤ ਨਹੀਂ। ਇਸ ਨੂੰ ਭਰਨ ਲਈ ਆਪਣਾ ਪਹਿਲਾ ਪਾਠ ਪੂਰਾ ਕਰੋ!","{stop} ਪਾਠ ਵਿੱਚ ਹਾਲੇ {n} ਹੋਰ ਲੱਭਣੇ ਬਾਕੀ","ਬੈਜ","ਪਹਿਲਾ ਸੰਕੇਤ","ਭੋਜਨ ਪੂਰਾ","ਪਰਿਵਾਰ ਪੂਰਾ","ਲਗਾਤਾਰ 3 ਦਿਨ","ਲਗਾਤਾਰ 7 ਦਿਨ","ਅਧਿਆਇ ਪੂਰਾ","{b} ਵਿੱਚੋਂ {a} ਮਿਲੇ","ਬੰਦ"],
    };
    Object.keys(PG_WORDS).forEach((code) => {
      if (!I18N[code]) return;
      PG_KEYS.forEach((k, i) => { I18N[code][k] = PG_WORDS[code][i]; });
    });
    applyI18n();
    const $ = (id) => document.getElementById(id);
    const setText = (id, key, vars) => { $(id).textContent = t(key, vars); };
    setText("l-streak", "pg_streak_label"); setText("l-signs", "pg_signs_label"); setText("l-stops", "pg_stops_label");
    setText("pg-change", "pg_change"); setText("h-cal", "pg_cal"); setText("h-cal-sub", "pg_cal_sub");
    setText("h-stops", "pg_stops"); setText("h-signs", "pg_signs"); setText("h-signs-sub", "pg_signs_sub"); setText("h-badges", "pg_badges");

    // ---------- What the app has saved ----------
    let progress = 0, profile = null, days = [];
    try { progress = parseInt(localStorage.getItem("signify-progress")) || 0; } catch (e) {}
    try { profile = JSON.parse(localStorage.getItem("signify-profile")); } catch (e) {}
    try { days = JSON.parse(localStorage.getItem("signify-days")) || []; } catch (e) {}

    // Opening this page counts as using the app today
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const dayKey = (d) => d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
    if (!days.includes(dayKey(today))) {
      days.push(dayKey(today)); days = days.slice(-60);
      try { localStorage.setItem("signify-days", JSON.stringify(days)); } catch (e) {}
    }

    // Streak now, and the longest streak ever (for badges)
    let streak = 0;
    for (let d = new Date(today); days.includes(dayKey(d)); d.setDate(d.getDate() - 1)) streak++;
    let longest = 0;
    days.forEach((k) => {
      const [y, m, dd] = k.split("-").map(Number);
      const d = new Date(y, m - 1, dd);
      const before = new Date(d); before.setDate(d.getDate() - 1);
      if (days.includes(dayKey(before))) return;      // only count from the start of each run
      let run = 0;
      for (const c = new Date(d); days.includes(dayKey(c)); c.setDate(c.getDate() + 1)) run++;
      longest = Math.max(longest, run);
    });

    // Signs learned = words in "learn" stops you've finished
    const learned = [];
    Object.keys(lessons).forEach((n) => {
      if (Number(n) <= progress && lessons[n].type === "learn") lessons[n].words.forEach((w) => learned.push({ key: w, stop: Number(n) }));
    });
    const doneStops = Math.min(progress, stops.length);

    // ---------- Hero ----------
    $("pg-level").textContent = learned.length >= 10 ? t("level2") : t("level1");
    $("n-streak").textContent = streak;
    $("n-signs").textContent = learned.length;
    $("n-stops").textContent = doneStops + "/" + stops.length;
    $("pg-goal").textContent = profile && profile.goal ? "🌱 " + t("pg_goal", { n: profile.goal }) : t("pg_goal_none");

    // ---------- Calendar: last 4 weeks, Monday first ----------
    const cal = $("cal");
    const monday = new Date(today); monday.setDate(today.getDate() - ((today.getDay() + 6) % 7));
    const start = new Date(monday); start.setDate(monday.getDate() - 21);
    let dayFmt = null;
    try { dayFmt = new Intl.DateTimeFormat(LANG, { weekday: "narrow" }); } catch (e) {}
    for (let i = 0; i < 7; i++) {
      const d = new Date(start); d.setDate(start.getDate() + i);
      const h = document.createElement("span"); h.className = "dow";
      h.textContent = dayFmt ? dayFmt.format(d) : "MTWTFSS"[i];
      cal.appendChild(h);
    }
    for (let i = 0; i < 28; i++) {
      const d = new Date(start); d.setDate(start.getDate() + i);
      const c = document.createElement("span"); c.className = "day";
      c.textContent = d.getDate();
      if (d > today) c.classList.add("future");
      else if (days.includes(dayKey(d))) c.classList.add("on");
      if (d.getTime() === today.getTime()) c.classList.add("today");
      cal.appendChild(c);
    }

    // ---------- Stops ----------
    const STOP_EMOJI = ["🥘", "✏️", "🏡", "✏️", "😴", "🙋", "✏️", "😊", "🏆"];
    const next = Math.min(progress + 1, stops.length);
    $("h-stops-sub").textContent = t("stops_done", { a: doneStops, b: stops.length });
    stops.forEach((label, i) => {
      const n = i + 1;
      const state = n <= progress ? "done" : (n === next && doneStops < stops.length) ? "now" : "locked";
      const li = document.createElement("li");
      const row = document.createElement(state === "locked" ? "div" : "a");
      row.className = "stop-row " + state;
      if (state !== "locked") row.href = "lesson.html?stop=" + n;
      row.innerHTML = '<span class="s-emoji" aria-hidden="true"></span><span class="s-name"></span><span class="s-state"></span>';
      row.querySelector(".s-emoji").textContent = STOP_EMOJI[i] || "⭐";
      row.querySelector(".s-name").textContent = n + ". " + tStop(label);
      const st = row.querySelector(".s-state");
      st.textContent = state === "done" ? "✅" : state === "now" ? "⛵" : "🔒";
      st.setAttribute("aria-label", state === "done" ? t("learned") : state === "now" ? t("now") : t("pg_locked"));
      li.appendChild(row);
      $("pg-stops").appendChild(li);
    });

    // ---------- Learned signs (only what you've learned, so nothing is spoiled) ----------
    const signsBox = $("pg-signs");
    if (!learned.length) {
      const p = document.createElement("p"); p.className = "pg-empty"; p.textContent = t("pg_none");
      signsBox.replaceWith(p);
      $("h-signs-sub").textContent = "";
    }
    learned.forEach(({ key, stop }) => {
      const a = document.createElement("a");
      a.href = "lesson.html?stop=" + stop;
      a.innerHTML = '<span class="w-main"></span><span class="w-sub"></span>';
      a.querySelector(".w-main").textContent = signs[key].emoji + " " + wordIn(key, LANG);
      a.querySelector(".w-main").lang = LANG;
      a.querySelector(".w-sub").textContent = LANG === "en" ? signs[key].hi : signs[key].en;
      signsBox.appendChild(a);
    });
    // Lessons not finished yet: just say how many signs are waiting
    Object.keys(lessons).forEach((n) => {
      if (Number(n) <= progress || lessons[n].type !== "learn") return;
      const row = document.createElement("div");
      row.className = "pg-mystery";
      row.innerHTML = '<span class="q" aria-hidden="true">🔒</span><span></span>';
      row.lastChild.textContent = t("pg_more", { n: lessons[n].words.length, stop: tStop(stops[n - 1]) });
      $("pg-mysteries").appendChild(row);
    });

    // ---------- Badges ----------
    const badges = [
      { icon: "🌱", key: "b_first",   got: learned.length > 0 },
      { icon: "🍎", key: "b_food",    got: progress >= 1 },
      { icon: "🏡", key: "b_family",  got: progress >= 3 },
      { icon: "🔥", key: "b_streak3", got: longest >= 3 },
      { icon: "⭐", key: "b_streak7", got: longest >= 7 },
      { icon: "🏆", key: "b_chapter", got: progress >= stops.length },
    ];
    badges.forEach((b) => {
      const el = document.createElement("div");
      el.className = "badge" + (b.got ? "" : " off");
      el.innerHTML = '<span class="b-icon" aria-hidden="true"></span><span class="b-name"></span>';
      el.querySelector(".b-icon").textContent = b.got ? b.icon : "🔒";
      el.querySelector(".b-name").textContent = t(b.key);
      if (!b.got) el.setAttribute("aria-label", t(b.key) + " · " + t("pg_locked"));
      $("pg-badges").appendChild(el);
    });
    $("h-badges-sub").textContent = t("pg_earned", { a: badges.filter((b) => b.got).length, b: badges.length });
  </script>
