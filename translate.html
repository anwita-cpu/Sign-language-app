<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signify · Languages</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Hind:wght@400;600&family=Noto+Sans+Bengali:wght@500;700&family=Noto+Sans+Telugu:wght@500;700&family=Noto+Sans+Tamil:wght@500;700&family=Noto+Sans+Gujarati:wght@500;700&family=Noto+Sans+Kannada:wght@500;700&family=Noto+Sans+Oriya:wght@500;700&family=Noto+Sans+Malayalam:wght@500;700&family=Noto+Sans+Gurmukhi:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="main.css">
  <link rel="stylesheet" href="translate.css">
  <script src="i18n.js"></script>
  <style>
    /* Language boxes only: no words or signs here, so the lessons stay a surprise */
    .dict-page main { max-width: 860px; }
    .lang-box { padding: 20px; }
    .lang-box .lang-list.lang-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; overflow: visible; padding: 0; }
    .lang-tiles button {
      position: relative; min-height: 96px; padding: 12px 16px; border-radius: 22px; box-shadow: 0 4px 0 var(--line);
      display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; text-align: left;
    }
    .lang-tiles .lt-name { font-size: 1.6rem; font-weight: 700; line-height: 1.2; }
    .lang-tiles .lt-en { font-size: 0.9rem; font-weight: 600; color: var(--muted); }
    .lang-tiles button:hover { border-color: var(--green); }
    .lang-tiles button[aria-pressed="true"] .lt-en { color: #EDE9FF; }
    .lang-tiles button[aria-pressed="true"]::after {
      content: "✓"; position: absolute; top: 10px; right: 12px; width: 24px; height: 24px; border-radius: 50%;
      display: grid; place-items: center; background: #fff; color: var(--green-dark); font-size: 0.85rem; font-weight: 800;
    }
    .lang-page .same-sign { margin: 0; }
    @media (max-width: 600px) {
      .lang-box .lang-list.lang-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .lang-tiles button { min-height: 80px; }
      .lang-tiles .lt-name { font-size: 1.3rem; }
    }
  </style>
</head>
<body class="dict-page lang-page">
  <main>

    <!-- TOP BAR -->
    <header class="dict-top">
      <a href="main.html" class="dict-back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        <span data-i18n="home">Home</span>
      </a>
      <div class="dict-logo">Signify</div>
    </header>

    <div class="dict-title">
      <h1 data-i18n="choose_lang">Choose your language</h1>
      <p id="lp-sub">Everything in Signify will switch to the language you pick.</p>
    </div>

    <!-- LANGUAGE BOXES -->
    <section class="lang-box">
      <div class="dict-eyebrow">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.8 5.5 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.5-3.8-9S9.5 5.5 12 3z"/></svg>
        <span data-i18n="your_lang">Your language</span>
      </div>
      <div class="lang-list lang-tiles" id="lang-list" role="group" aria-label="Choose your language" data-i18n-aria="choose_lang"></div>
    </section>

    <p class="same-sign">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
      <span data-i18n="same_sign">The sign is the same in every language. Only the word changes.</span>
    </p>

  </main>

  <script src="signs.js?v=3"></script>
  <script>
    // This page's own words, in all 11 languages
    const LP_WORDS = {
      en: { lp_sub: "Everything in Signify will switch to the language you pick." },
      hi: { lp_sub: "आप जो भाषा चुनेंगे, Signify में सब कुछ उसी भाषा में हो जाएगा।" },
      bn: { lp_sub: "আপনি যে ভাষা বেছে নেবেন, Signify-এর সবকিছু সেই ভাষায় হয়ে যাবে।" },
      mr: { lp_sub: "तुम्ही निवडलेल्या भाषेत Signify मधील सर्व काही दिसेल." },
      te: { lp_sub: "మీరు ఎంచుకున్న భాషలో Signify మొత్తం కనిపిస్తుంది." },
      ta: { lp_sub: "நீங்கள் தேர்ந்தெடுக்கும் மொழியில் Signify முழுவதும் மாறும்." },
      gu: { lp_sub: "તમે પસંદ કરશો તે ભાષામાં Signify માં બધું બદલાઈ જશે." },
      kn: { lp_sub: "ನೀವು ಆಯ್ಕೆಮಾಡುವ ಭಾಷೆಗೆ Signify ಪೂರ್ತಿ ಬದಲಾಗುತ್ತದೆ." },
      or: { lp_sub: "ଆପଣ ବାଛିଥିବା ଭାଷାରେ Signifyର ସବୁକିଛି ଦେଖାଯିବ।" },
      ml: { lp_sub: "നിങ്ങൾ തിരഞ്ഞെടുക്കുന്ന ഭാഷയിലേക്ക് Signify മുഴുവൻ മാറും." },
      pa: { lp_sub: "ਤੁਸੀਂ ਜੋ ਭਾਸ਼ਾ ਚੁਣੋਗੇ, Signify ਵਿੱਚ ਸਭ ਕੁਝ ਉਸੇ ਭਾਸ਼ਾ ਵਿੱਚ ਹੋ ਜਾਵੇਗਾ।" },
    };
    Object.keys(LP_WORDS).forEach((code) => { if (I18N[code]) Object.assign(I18N[code], LP_WORDS[code]); });
    applyI18n();
    document.getElementById("lp-sub").textContent = t("lp_sub");

    // One big box per language; tapping one switches the whole app
    const langList = document.getElementById("lang-list");
    languages.forEach((l) => {
      const b = document.createElement("button");
      b.type = "button";
      b.lang = l.code;
      b.setAttribute("aria-pressed", String(l.code === LANG));
      b.innerHTML = '<span class="lt-name"></span><span class="lt-en" lang="en"></span>';
      b.querySelector(".lt-name").textContent = l.name;
      b.querySelector(".lt-en").textContent = l.code === "en" ? "" : l.english;
      b.addEventListener("click", () => setLang(l.code, "translate.html"));
      langList.appendChild(b);
    });
  </script>
</body>
</html>
